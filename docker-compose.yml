services:
  fuseki:
    build: ./docker
    ports:
      - "3030:3030"
    volumes:
      - tdb:/data
      - ./output:/import/output:ro
      - ./ontology:/import/ontology:ro
      - ./shapes:/import/shapes:ro
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "8000:8000"
    depends_on:
      - fuseki
volumes:
  tdb:
